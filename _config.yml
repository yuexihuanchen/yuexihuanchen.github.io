# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: yuexihuachen
subtitle: ''
description: ''
keywords:
author: yuexihuachen
language: en
timezone: ''

# aircloud required settings
SEOTitle: yuexihuachen
email: 2578038405@qq.com
keyword: ''
sidebar-avatar: img/avatar.jpg
search:
  path: search.json
  field: post

# Social links (leave blank until configured)
weibo_username: ''
zhihu_username: ''
github_username: ''
twitter_username: ''
facebook_username: ''
linkedin_username: ''


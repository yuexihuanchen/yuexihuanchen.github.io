<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hexo</title>
    
<link rel="stylesheet" href="/css/style.css">

<meta name="generator" content="Hexo 8.1.2"></head>
<body>

    <canvas id="starfield"></canvas>

    <div class="page">

    <!-- =========================================
         Navigation
         ========================================= -->

    <header class="glass-header">

        <h1>
            <a href="/">YUEXIHUANCHEN</a>
        </h1>

        <nav>
            <a href="/">Home</a>
            <a href="/archives/">Blog</a>
            <a href="/projects/">Projects</a>
            <a href="/about/">About</a>
        </nav>

    </header>


    <main>

        <!-- =========================================
             Hero
             ========================================= -->

        <section class="hero">

            <p class="eyebrow">
                PERSONAL TECH BLOG
            </p>

            <h2>
                YUEXIHUANCHEN
            </h2>

            <div class="hero-line"></div>

            <p class="hero-role">
                Backend Developer
            </p>


            <!-- Technology Stack -->

            <div class="tech-stack">

                <span class="tech-tag">
                    Java
                </span>

                <span class="tech-tag">
                    Spring Boot
                </span>

                <span class="tech-tag">
                    MySQL
                </span>

                <span class="tech-tag">
                    Docker
                </span>

                <span class="tech-tag">
                    AI
                </span>

            </div>

        </section>


        <!-- =========================================
             Latest Posts
             ========================================= -->

        <section class="posts">

            <div class="section-title">

                <h2>
                    Latest Posts
                </h2>

                <span></span>

            </div>


            <div class="post-list">

                

                    <article class="post-card">

                        <!-- Post Image -->

                        <div class="post-image">

                            <div class="post-image-placeholder">
                                ✦
                            </div>

                        </div>


                        <!-- Post Information -->

                        <div class="post-info">

                            <h3>

                                <a href="/2026/09/12/first-post-tech-stack/">
                                    你好，世界：我的个人技术博客正式上线
                                </a>

                            </h3>


                            <p class="post-excerpt">

                                记录技术学习、项目实践与成长过程。

                            </p>


                            <div class="post-meta">

                                <time>
                                    2026-09-12
                                </time>


                                

                                    

                                        <span class="post-tag">
                                            Blog
                                        </span>

                                    

                                        <span class="post-tag">
                                            Hexo
                                        </span>

                                    

                                

                            </div>

                        </div>


                        <!-- Arrow -->

                        <a
                            class="post-arrow"
                            href="/2026/09/12/first-post-tech-stack/"
                            aria-label="Read article"
                        >
                            →
                        </a>

                    </article>

                

            </div>

        </section>

    </main>

</div>


    
<script src="/js/main.js"></script>

</body>
</html>
